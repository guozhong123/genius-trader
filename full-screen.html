<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天才交易员</title>
  </head>
  <body>
    <div class="app-frame">
      <!-- 左侧重大消息（默认展开） -->
      <aside id="news-sidebar" class="news-sidebar glass">
        <div class="news-sidebar-head">
          <div>
            <div class="text-sm font-semibold">重大消息</div>
            <div class="text-[10px]" style="color: var(--muted)">宏观 · 科技 · 少而精</div>
          </div>
          <button id="news-close-btn" class="rounded-md p-1" style="color: var(--muted)" title="关闭侧栏">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div id="news-list" class="news-list"></div>
        <p id="news-empty" class="px-3 py-6 text-center text-[11px]" style="color: var(--muted)">暂无重大消息</p>
      </aside>

      <div class="page-shell mx-auto min-h-screen px-3 pb-10 pt-3 sm:px-4">
        <!-- 顶栏 -->
        <div class="mb-2 flex flex-wrap items-center gap-2">
          <button id="news-open-btn" class="news-open-btn glass hidden shrink-0 rounded-lg px-2 py-1.5 text-[11px] font-semibold text-accent" title="打开重大消息">消息</button>
          <section id="search-wrap" class="relative min-w-0 flex-1">
            <div class="pointer-events-none absolute inset-y-0 left-2.5 flex items-center" style="color: var(--muted)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            </div>
            <input id="search-input" type="search" autocomplete="off" placeholder="添加股票 / 基金…"
              class="glass w-full rounded-lg py-2 pl-9 pr-2 text-sm outline-none" />
            <div id="search-results" class="absolute z-30 mt-1 hidden max-h-72 w-full overflow-auto rounded-lg shadow-xl"
              style="background: var(--panel-solid); border: 1px solid var(--line)"></div>
          </section>

          <div class="glass flex shrink-0 rounded-lg p-0.5 text-xs font-semibold">
            <button data-view="watch" class="view-tab rounded-md bg-accent px-2 py-1.5 text-white">自选</button>
            <button data-view="data" class="view-tab rounded-md px-2 py-1.5" style="color: var(--muted)">资金</button>
            <button data-view="boards" class="view-tab rounded-md px-2 py-1.5" style="color: var(--muted)">板块</button>
            <button data-view="rank" class="view-tab rounded-md px-2 py-1.5" style="color: var(--muted)">涨跌榜</button>
            <button data-view="etf" class="view-tab rounded-md px-2 py-1.5" style="color: var(--muted)">热力图</button>
          </div>

          <div id="theme-picker" class="glass flex shrink-0 items-center gap-0.5 rounded-lg p-0.5"></div>
          <button id="import-btn" class="glass shrink-0 rounded-lg px-2 py-1.5 text-[11px] font-semibold" style="color: var(--muted)">导入</button>
          <button id="refresh-btn" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-white bg-accent" title="刷新">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.2"/><path d="M21 3v7h-7"/></svg>
          </button>
        </div>

        <!-- 事件日历提示条 -->
        <div id="event-banner" class="mb-2 hidden rounded-xl px-3 py-2 ring-soft" style="background: color-mix(in oklab, var(--accent) 10%, transparent)">
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-[11px] font-semibold text-accent">事件日历</span>
            <div id="event-banner-text" class="min-w-0 flex-1 text-[12px]"></div>
            <button id="event-calendar-btn" class="rounded-md px-2 py-1 text-[11px] font-semibold ring-soft" style="color: var(--muted)">近两周</button>
            <button id="event-dismiss-btn" class="rounded-md px-1.5 py-1 text-[11px]" style="color: var(--muted)" title="今日不再提示">×</button>
          </div>
        </div>
        <div id="event-panel" class="mb-2 hidden rounded-xl p-3 ring-soft" style="background: var(--panel)"></div>

        <!-- 止损提醒条 -->
        <div id="stop-banner" class="mb-2 hidden rounded-xl px-3 py-2" style="background: color-mix(in oklab, #f59e0b 14%, transparent); border: 1px solid color-mix(in oklab, #f59e0b 35%, transparent)">
          <div class="flex items-start justify-between gap-2">
            <div id="stop-banner-text" class="min-w-0 flex-1 text-[12px] leading-relaxed"></div>
            <button id="stop-banner-close" class="shrink-0 rounded-md px-1.5 py-0.5 text-[11px]" style="color: var(--muted)">×</button>
          </div>
        </div>

        <!-- 大盘：仅自选显示 -->
        <div id="indices-bar" class="mb-2 flex items-stretch gap-1.5">
          <div class="flex shrink-0 items-center text-[10px] font-semibold" style="color: var(--muted)">大盘</div>
          <section id="indices" class="indices-row flex min-w-0 flex-1 items-stretch gap-1"></section>
          <button id="add-index-btn" class="glass shrink-0 self-center rounded-md px-2 py-1.5 text-[10px] font-semibold text-accent" title="勾选指数">+指数</button>
        </div>
        <section id="indices-mobile" class="hidden"></section>

        <!-- 自选 -->
        <section id="view-watch">
          <div class="mb-1.5 flex flex-wrap items-center gap-1.5">
            <div class="glass flex rounded-lg p-0.5 text-xs font-semibold">
              <button data-primary="stock" class="primary-tab rounded-md bg-accent px-2.5 py-1 text-white">股票</button>
              <button data-primary="fund" class="primary-tab rounded-md px-2.5 py-1" style="color: var(--muted)">基金</button>
            </div>
            <button id="insight-btn" class="rounded-md bg-accent/10 px-2 py-1 text-[11px] font-semibold text-accent ring-soft">实时简析</button>
            <button id="calendar-btn" class="rounded-md px-2 py-1 text-[11px] font-semibold ring-soft" style="color: var(--muted)">事件日历</button>
            <p id="status-text" class="ml-auto text-[10px]" style="color: var(--muted)">准备就绪</p>
          </div>
          <div id="group-tabs" class="mb-1 flex flex-wrap gap-1"></div>
          <div class="mb-2">
            <button id="add-group-btn" class="inline-flex h-7 w-7 items-center justify-center rounded-md text-sm font-semibold ring-soft text-accent" title="新建分组">+</button>
          </div>
          <div id="insight-panel" class="mb-2 hidden rounded-xl p-3 ring-soft" style="background: var(--panel)"></div>
          <div id="list" class="list-panel mx-auto"></div>
          <div id="empty" class="glass mx-auto mt-2 hidden max-w-xl rounded-xl px-4 py-10 text-center">
            <h2 data-empty-title class="text-base font-semibold">还没有自选</h2>
            <p data-empty-desc class="mt-1 text-xs" style="color: var(--muted)">顶部搜索添加</p>
          </div>
        </section>

        <section id="view-data" class="hidden space-y-2">
          <div id="flow-summary" class="grid grid-cols-3 gap-1 sm:grid-cols-4 lg:grid-cols-7"></div>
          <div class="glass rounded-xl p-2.5">
            <div class="mb-1 text-sm font-semibold">沪深主力资金</div>
            <div id="chart-market-flow" class="h-52 w-full sm:h-60"></div>
          </div>
          <div class="grid gap-2 lg:grid-cols-2">
            <div class="glass rounded-xl p-2.5">
              <div class="mb-1 text-sm font-semibold">涨跌分布</div>
              <p id="zd-summary" class="mb-1 text-[10px]" style="color: var(--muted)">—</p>
              <div id="chart-updown" class="h-48 w-full"></div>
            </div>
            <div class="glass rounded-xl p-2.5">
              <div class="mb-1 text-sm font-semibold">北向资金</div>
              <p id="nb-summary" class="mb-1 text-[10px]" style="color: var(--muted)">—</p>
              <div id="chart-northbound" class="h-48 w-full"></div>
            </div>
          </div>
        </section>

        <section id="view-boards" class="hidden space-y-2">
          <div class="flex flex-wrap gap-1">
            <button data-board="industry" class="board-tab rounded-md bg-accent px-2 py-1 text-xs font-semibold text-white">行业</button>
            <button data-board="concept" class="board-tab rounded-md px-2 py-1 text-xs font-semibold ring-soft" style="color: var(--muted)">概念</button>
            <button data-board="region" class="board-tab rounded-md px-2 py-1 text-xs font-semibold ring-soft" style="color: var(--muted)">地域</button>
          </div>
          <div class="glass rounded-xl p-2.5">
            <div id="chart-boards" class="h-[520px] w-full"></div>
          </div>
          <div id="boards-list" class="hidden"></div>
        </section>

        <section id="view-rank" class="hidden">
          <div class="mb-1.5 flex flex-wrap items-center gap-2">
            <div class="glass flex rounded-md p-0.5 text-xs font-semibold">
              <button data-rank="up" class="rank-tab rounded bg-accent px-2 py-1 text-white">涨幅 TOP100</button>
              <button data-rank="down" class="rank-tab rounded px-2 py-1" style="color: var(--muted)">跌幅 TOP100</button>
            </div>
            <select id="rank-sort" class="glass rounded-md px-1.5 py-1 text-[11px] outline-none">
              <option value="pct">涨跌幅</option>
              <option value="price">价格</option>
              <option value="name">名称</option>
            </select>
          </div>
          <div id="rank-list" class="list-panel glass mx-auto overflow-hidden rounded-xl"></div>
        </section>

        <section id="view-etf" class="hidden">
          <div class="glass mb-1.5 rounded-lg px-2.5 py-1.5 text-[10px]" style="color: var(--muted)">
            内嵌 <a href="https://52etf.site/" target="_blank" rel="noreferrer" class="text-accent underline">52etf.site</a>
          </div>
          <iframe id="etf-frame" src="https://52etf.site/" class="h-[70vh] w-full rounded-xl border-0 ring-soft" loading="lazy" referrerpolicy="no-referrer"></iframe>
        </section>

        <footer class="mt-4 text-center text-[10px]" style="color: var(--muted)">行情仅供参考，不构成投资建议。</footer>
      </div>
    </div>

    <div id="detail-root" class="modal-wrap fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6">
      <div id="detail-mask" class="absolute inset-0" style="background: var(--mask)"></div>
      <div id="detail-panel" class="modal-panel relative z-10 flex max-h-[90vh] w-[min(640px,96vw)] flex-col overflow-hidden rounded-2xl shadow-2xl"
        style="background: var(--panel-solid); border: 1px solid var(--line)">
        <div class="flex shrink-0 items-start gap-3 border-b px-3 py-2.5" style="border-color: var(--line)">
          <div class="min-w-0 flex-1">
            <div id="detail-name" class="truncate text-base font-semibold">—</div>
            <div id="detail-sub" class="mt-0.5 text-[11px]" style="color: var(--muted)">—</div>
          </div>
          <div class="shrink-0 text-right">
            <div id="detail-price" class="text-lg font-semibold tabular-nums">—</div>
            <div id="detail-pct" class="text-sm font-semibold tabular-nums">—</div>
          </div>
          <button id="detail-close" class="rounded-lg p-1.5" style="color: var(--muted)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="min-h-0 flex-1 space-y-2.5 overflow-auto p-3">
          <div id="fund-stats" class="hidden grid grid-cols-2 gap-1.5 sm:grid-cols-4"></div>
          <div id="stock-chart-wrap">
            <div id="risk-tools" class="mb-2 grid grid-cols-3 gap-1.5">
              <label class="block text-[10px]" style="color:var(--muted)">止损价
                <input id="input-stop" type="number" step="any" class="glass mt-0.5 w-full rounded-md px-2 py-1 text-xs outline-none" placeholder="如 12.50" />
              </label>
              <label class="block text-[10px]" style="color:var(--muted)">支撑位
                <input id="input-support" type="number" step="any" class="glass mt-0.5 w-full rounded-md px-2 py-1 text-xs outline-none" placeholder="自动/手填" />
              </label>
              <label class="block text-[10px]" style="color:var(--muted)">压力位
                <input id="input-resist" type="number" step="any" class="glass mt-0.5 w-full rounded-md px-2 py-1 text-xs outline-none" placeholder="自动/手填" />
              </label>
            </div>
            <div class="mb-1.5 flex flex-wrap items-center gap-1">
              <button data-period="intraday" class="period-btn rounded-md bg-accent px-2 py-1 text-xs font-semibold text-white">分时</button>
              <button data-period="day" class="period-btn rounded-md px-2 py-1 text-xs font-semibold ring-soft" style="color: var(--muted)">日K</button>
              <button data-period="week" class="period-btn rounded-md px-2 py-1 text-xs font-semibold ring-soft" style="color: var(--muted)">周K</button>
              <button data-period="month" class="period-btn rounded-md px-2 py-1 text-xs font-semibold ring-soft" style="color: var(--muted)">月K</button>
              <button id="save-levels-btn" class="ml-auto rounded-md bg-accent px-2 py-1 text-xs font-semibold text-white">保存位</button>
            </div>
            <div id="chart-main" class="h-56 w-full rounded-lg ring-soft sm:h-64"></div>
            <div class="mt-2">
              <div class="mb-1 flex items-center justify-between">
                <div class="text-sm font-semibold">主力资金</div>
                <div id="detail-flow-tip" class="text-[10px]" style="color: var(--muted)">亿元</div>
              </div>
              <div id="detail-flow-cards" class="mb-1.5 grid grid-cols-5 gap-1"></div>
              <div id="chart-stock-flow" class="h-44 w-full rounded-lg ring-soft"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="dialog-root" class="modal-wrap fixed inset-0 z-[70] hidden items-center justify-center p-4">
      <div id="dialog-mask" class="absolute inset-0" style="background: var(--mask)"></div>
      <div id="dialog" class="modal-panel relative z-10 w-[min(420px,92vw)] rounded-2xl p-4 shadow-2xl"
        style="background: var(--panel-solid); border: 1px solid var(--line)">
        <div id="dialog-title" class="text-sm font-semibold">确认</div>
        <div id="dialog-body" class="mt-3"></div>
        <div class="mt-4 flex justify-end gap-2">
          <button id="dialog-cancel" class="rounded-lg px-3 py-1.5 text-xs font-semibold ring-soft" style="color: var(--muted)">取消</button>
          <button id="dialog-ok" class="rounded-lg bg-accent px-3 py-1.5 text-xs font-semibold text-white">确定</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
